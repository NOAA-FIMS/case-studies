project:
  type: website
  render:
    - index.qmd
    - content/AFSC-GOA-pollock.qmd
    - content/NEFSC-yellowtail.qmd
    - content/pacific-hake.qmd
    - content/acknowledgements.qmd

website:
  page-navigation: true
  title: "NOAA FIMS case studies"
  site-url: "https://noaa-fims.github.io/case-studies"
  repo-url: "https://github.com/NOAA-FIMS/case-studies"
  repo-actions: [edit, source, issue]
  favicon: images/favicon.ico

  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "&copy; CC-1.0"

  sidebar:
    background: "#D9E3E4"
    logo: "https://raw.githubusercontent.com/nmfs-opensci/assets/main/logo/nmfs-opensci-logo3.png"
    favicon: images/favicon.ico
    pinned: true
    align: center
    tools:
      - icon: globe
        href: https://nmfs-opensci.github.io
        text: "NMFS Open Science"
      - icon: github
        href: https://github.com/NOAA-FIMS/case-studies
        text: "NOAA FIMS case studies"

    style: "docked"
    search: true
    collapse-level: 1
    contents: auto

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme-dark.scss]
    code-copy: true
    code-overflow: wrap
    toc: true


filters:
  - include-files.lua
  - quarto


