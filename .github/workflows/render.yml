name: Render and Deploy Full Site
# for everything other than case studies

on:
  push:
    branches: [ main ]
    paths:
      - '!content/**'
      - '!.github/workflows/render-case-studies.yml'
      - '!README.md'
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libv8-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libcairo2-dev \
            libgit2-dev \
            libnode-dev \
            libx11-dev \
            pandoc

      - name: Set up R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          pak-version: stable
          cache: true
          packages: |
            cran::rmarkdown
            cran::knitr
            cran::jsonlite
            cran::dplyr
            cran::ggplot2
            cran::tidyr
            cran::TMB
            cran::remotes
            cran::reshape2
            cran::Rcpp
            cran::glue
            cran::purrr
            cran::ggridges
          extra-packages: |
            github::nmfs-ost/stockplotr
            github::stan-dev/cmdstanr
            github::mjskay/tidybayes
            github::stan-dev/shinystan
            github::noaa-afsc/SparseNUTS
            github::NOAA-FIMS/FIMS
            github::r4ss/r4ss

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Restore existing case-study pages from gh-pages
        shell: bash
        run: |
          rm -rf /tmp/gh-pages
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" /tmp/gh-pages || true

          if [ -d /tmp/gh-pages/content ]; then
            mkdir -p _site/content
            cp -R /tmp/gh-pages/content/. _site/content/
          fi

          # Also merge the site_libs from gh-pages to include case study dependencies
          if [ -d /tmp/gh-pages/site_libs ]; then
            cp -rT /tmp/gh-pages/site_libs _site/site_libs
          fi

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5